[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petcare"
version = "0.1.0"
description = "Transit candidate vetting for young stars: small, single-purpose tests that each answer one question."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Madyson Barber"}, {name = "Andrew Mann"}]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "batman-package>=2.4",
    # batman imports distutils, which Python 3.12 removed; setuptools provides it
    "setuptools>=60; python_version >= '3.12'",
    "celerite2>=0.2",
    "astroquery>=0.4.6",
    "certifi",
    "requests",
]

[project.urls]
Homepage = "https://github.com/awmann/PetCare_Public"
Issues = "https://github.com/awmann/PetCare_Public/issues"

[project.optional-dependencies]
# Needed by pc_crossmatch (MAST light-curve products) and nothing else.
crossmatch = ["lightkurve>=2.4"]
# Parquet catalogues.
parquet = ["pyarrow>=12"]
dev = ["pytest>=7"]
# Makes light curves with tessquicklook; 0.9.5 of tess-point has broken FFI planning.
extract = ["tessquicklook @ git+https://github.com/awmann/tessquicklook.git", "tess-point==0.9.4"]
all = ["petcare[crossmatch,parquet,extract]"]

[project.scripts]
petcare = "petcare.scripts.petcare:main"
pc-fit = "petcare.scripts.pc_fit:main"
pc-depths = "petcare.scripts.pc_depths:main"
pc-oddeven = "petcare.scripts.pc_oddeven:main"
pc-shape = "petcare.scripts.pc_shape:main"
pc-duration = "petcare.scripts.pc_duration:main"
pc-companion = "petcare.scripts.pc_companion:main"
pc-secondary = "petcare.scripts.pc_secondary:main"
pc-instrument = "petcare.scripts.pc_instrument:main"
pc-rotation = "petcare.scripts.pc_rotation:main"
pc-phasecurve = "petcare.scripts.pc_phasecurve:main"
pc-shapetime = "petcare.scripts.pc_shapetime:main"
pc-interp = "petcare.scripts.pc_interp:main"
pc-jointgp = "petcare.scripts.pc_jointgp:main"
pc-flares = "petcare.scripts.pc_flares:main"
pc-stellar = "petcare.scripts.pc_stellar:main"
pc-neighbours = "petcare.scripts.pc_neighbours:main"
pc-astrometry = "petcare.scripts.pc_astrometry:main"
pc-exofop = "petcare.scripts.pc_exofop:main"
pc-followup = "petcare.scripts.pc_followup:main"
pc-centroid = "petcare.scripts.pc_centroid:main"
pc-dedup = "petcare.scripts.pc_dedup:main"
pc-known = "petcare.scripts.pc_known:main"
pc-archival = "petcare.scripts.pc_archival:main"
pc-crossmatch = "petcare.scripts.pc_crossmatch:main"
pc-pixels = "petcare.scripts.pc_pixels:main"
pc-uniqueness = "petcare.scripts.pc_uniqueness:main"
pc-doctor = "petcare.scripts.pc_doctor:main"
pc-extract = "petcare.scripts.pc_extract:main"

[tool.setuptools.packages.find]
include = ["petcare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
